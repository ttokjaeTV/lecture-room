<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>입장 비밀번호 만들기</title>
<style>
  body { font-family: -apple-system, 'Malgun Gothic', sans-serif; background: #F5EFE6; color: #1A1A1A; margin: 0; padding: 40px 16px; }
  .box { max-width: 520px; margin: 0 auto; background: #FBF7F0; border: 1px solid #E5DCC8; border-radius: 14px; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #6b6358; font-size: 14px; line-height: 1.6; }
  input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #E5DCC8; border-radius: 10px; font-size: 15px; }
  code { display: block; word-break: break-all; background: #fff; border: 1px dashed #C4A57B; border-radius: 10px; padding: 12px; margin-top: 12px; font-size: 13px; min-height: 20px; }
</style>
</head>
<body>
<div class="box">
  <h1>입장 비밀번호 만들기</h1>
  <p>새 비밀번호를 입력하면 아래에 값이 나와요. 이 값을 <b>js/config.js</b> 의 <b>SITE_PASSWORD_SHA256</b> 따옴표 안에 붙여넣고 다시 올리면 비밀번호가 바뀝니다. 입력한 비밀번호는 어디에도 전송되지 않아요.</p>
  <input id="pw" type="text" placeholder="새 비밀번호" autocomplete="off">
  <code id="out"></code>
</div>
<script src="../js/gate.js"></script>
<script>
  var pw = document.getElementById('pw'), out = document.getElementById('out');
  pw.addEventListener('input', function () { out.textContent = pw.value ? window.LRGate.sha256(pw.value) : ''; });
</script>
</body>
</html>
